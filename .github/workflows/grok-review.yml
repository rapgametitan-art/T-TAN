name: grok-review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Grok CLI
        run: |
          curl -fsSL https://x.ai/cli/install.sh | bash
          echo "$HOME/.grok/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Review PR
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          grok --always-approve --no-auto-update -p "$(cat <<EOF
          You are reviewing a GitHub pull request.
          1. Read the full diff: git diff origin/${BASE_REF}...HEAD
          2. Identify bugs, security issues, and clear regressions. Ignore style nits and pure refactors.
          3. Write a concise review to /tmp/review.md. Start with a one-line summary. List only real issues with file paths and line context. If there are no issues, write exactly: "No blocking issues found."
          4. Post it: gh pr review ${PR_NUMBER} --comment --body-file /tmp/review.md
          Do not approve. Do not request changes unless a real bug exists.
          EOF
          )"
